name: Build ZMK Firmware

on:
  push:
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.west
            .west
          key: ${{ runner.os }}-west-${{ hashFiles('config/west.yml') }}

      - name: Build Firmware
        uses: zmkfirmware/zmk-build-action@v1
        with:
          board: supermini_nrf52840
          shield: teclado
          name: firmware
          path: teclado_firmware.uf2
